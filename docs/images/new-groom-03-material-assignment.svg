<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">MeshInstance3D material assignment illustration</title>
  <desc id="desc">An honest editor-style illustration showing profile and groom resources feeding HairMaterialProfile.create_material, then assigning the resulting ShaderMaterial to MeshInstance3D.material_override.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08121f"/>
      <stop offset="0.52" stop-color="#10263a"/>
      <stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#271429"/>
      <stop offset=".4" stop-color="#89504d"/>
      <stop offset=".73" stop-color="#f0b66e"/>
      <stop offset="1" stop-color="#53d2ca"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cd6cc" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5cd6cc" stop-opacity=".6"/>
      <stop offset="1" stop-color="#f0b36f" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .ui { font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #dce7f7; }
      .mono { font-family: 'IBM Plex Mono', 'SFMono-Regular', monospace; fill: #bdcbe2; }
      .muted { fill: #7789a7; }
      .small { font-size: 14px; letter-spacing: .02em; }
      .label { font-size: 16px; font-weight: 600; }
      .value { font-size: 15px; }
      .title { font-size: 23px; font-weight: 600; letter-spacing: -.02em; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="820" cy="480" r="290" fill="#37beb8" opacity=".08" filter="url(#glow)"/>
  <circle cx="1200" cy="180" r="220" fill="#ca625a" opacity=".12" filter="url(#glow)"/>
  <rect x="24" y="22" width="1352" height="856" rx="18" fill="#0c1423" stroke="#31415d" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="24" y="22" width="1352" height="58" rx="18" fill="#111d31"/><path d="M24 62H1376" stroke="#2a3a56"/>
  <circle cx="52" cy="51" r="7" fill="#ef6b76"/><circle cx="76" cy="51" r="7" fill="#e7ad59"/><circle cx="100" cy="51" r="7" fill="#58c7a4"/>
  <g class="ui"><text x="132" y="57" class="title">Godot</text><text x="211" y="56" class="small muted">HairMaterialProfileEditor.tscn</text><text x="1140" y="56" class="small" fill="#d99b5e">EDITOR-STYLE ILLUSTRATION</text></g>
  <text x="1140" y="73" class="ui small muted">not a literal screenshot</text>

  <rect x="42" y="98" width="258" height="756" rx="12" fill="#101a2b" stroke="#293b58"/>
  <text x="64" y="130" class="ui small muted">SCENE</text><path d="M62 151H280" stroke="#293b58"/>
  <g class="mono small">
    <text x="64" y="184" fill="#f1c078">▾ HairMaterialProfileEditor</text>
    <text x="80" y="218">WorldEnvironment</text><text x="80" y="250">KeyLight</text><text x="80" y="282">Camera3D</text><text x="80" y="314">PresentationPlinth</text>
  </g>
  <rect x="66" y="329" width="214" height="34" rx="7" fill="#294b55" stroke="#5cd6cc"/>
  <text x="80" y="352" class="mono small" fill="#a1f0df">HairPreview  ◈</text>
  <text x="98" y="389" class="mono small">▾ Blowout</text><rect x="96" y="401" width="184" height="32" rx="6" fill="#49364b"/><text x="110" y="423" class="mono small" fill="#f0b67d">MeshInstance3D</text>
  <text x="64" y="500" class="ui small muted">SELECTED NODE</text><text x="64" y="530" class="ui title">HairPreview</text><text x="64" y="556" class="mono small muted">MeshInstance3D</text>
  <rect x="64" y="600" width="216" height="92" rx="9" fill="#172c3b"/><text x="80" y="626" class="ui small" fill="#7ee3d5">@tool preview</text><text x="80" y="652" class="ui small muted">resolves the hair mesh</text><text x="80" y="674" class="ui small muted">and owns the local override</text>

  <rect x="318" y="98" width="700" height="430" rx="12" fill="#13253a" stroke="#293b58"/>
  <text x="346" y="130" class="ui small" fill="#e7b36b">03 / FINAL ASSIGNMENT</text><text x="346" y="158" class="ui title">Resources → ShaderMaterial → MeshInstance3D</text>
  <path d="M378 274H954" stroke="url(#beam)" stroke-width="3"/><path d="M608 266l16 8-16 8M842 266l16 8-16 8" fill="none" stroke="#70ddd2" stroke-width="2"/>
  <rect x="350" y="205" width="200" height="126" rx="11" fill="#172e42" stroke="#3c6078"/>
  <text x="372" y="233" class="ui small" fill="#e6b16c">INPUT 01</text><text x="372" y="263" class="ui label">HairMaterialProfile</text><text x="372" y="290" class="mono small">hair_material_profile_</text><text x="372" y="310" class="mono small">demo.tres</text>
  <rect x="580" y="205" width="200" height="126" rx="11" fill="#17373b" stroke="#3d7d79"/>
  <text x="602" y="233" class="ui small" fill="#7ee2d3">INPUT 02</text><text x="602" y="263" class="ui label">HairGroomData</text><text x="602" y="290" class="mono small">blowout_groom_data.tres</text><text x="602" y="316" class="ui small muted">coords + attributes</text>
  <rect x="810" y="205" width="172" height="126" rx="11" fill="#4b3543" stroke="#a86c6b"/>
  <text x="832" y="233" class="ui small" fill="#f2b67d">COMPOSE</text><text x="832" y="265" class="mono label" fill="#ffd093">create_material</text><text x="832" y="292" class="mono small">(groom_data)</text><circle cx="948" cy="306" r="8" fill="#65d6bf"/><path d="M945 306l3 3 6-7" fill="none" stroke="#10242a" stroke-width="2"/>
  <rect x="350" y="371" width="632" height="116" rx="10" fill="#0d1727" stroke="#38516d"/>
  <text x="372" y="400" class="ui small muted">RESULT</text><text x="372" y="431" class="ui label" fill="#f0bc78">ShaderMaterial</text><text x="372" y="458" class="mono small">shader = hair_marschner_unity_fast.gdshader</text>

  <rect x="318" y="551" width="700" height="303" rx="12" fill="#101a2b" stroke="#293b58"/>
  <text x="346" y="585" class="ui small muted">THE ASSIGNMENT IN YOUR SCENE SCRIPT</text>
  <rect x="346" y="604" width="644" height="142" rx="9" fill="#0a111e" stroke="#344c6b"/>
  <text x="370" y="635" class="mono value"><tspan fill="#c189dc">var</tspan> material: ShaderMaterial = profile.create_material(groom_data)</text>
  <text x="370" y="670" class="mono value"><tspan fill="#c189dc">hair_mesh</tspan>.material_override = material</text>
  <path d="M370 690H950" stroke="#243854"/>
  <text x="370" y="720" class="ui small muted">The profile selects the compiled shader; the groom binds both maps.</text>
  <rect x="346" y="768" width="644" height="54" rx="8" fill="#173c3a"/><circle cx="372" cy="795" r="8" fill="#66d5b5"/><text x="390" y="801" class="ui value" fill="#a8ecda">Ready: material_override owns the preview instance.</text>

  <rect x="1036" y="98" width="322" height="756" rx="12" fill="#101a2b" stroke="#293b58"/>
  <text x="1060" y="130" class="ui small muted">INSPECTOR</text><path d="M1058 151H1336" stroke="#293b58"/>
  <text x="1060" y="184" class="ui title">HairPreview</text><text x="1060" y="208" class="mono small muted">MeshInstance3D</text>
  <rect x="1058" y="233" width="278" height="36" rx="7" fill="#182941"/><text x="1072" y="256" class="mono small">res://assets/hair/models/</text><text x="1072" y="276" class="mono small">blowout/blowout.glb</text>
  <text x="1060" y="324" class="ui small" fill="#e5b26b">GEOMETRY</text>
  <rect x="1058" y="341" width="278" height="108" rx="9" fill="#17263c" stroke="#405775"/>
  <text x="1072" y="369" class="ui label">Material Override</text><text x="1072" y="398" class="ui value" fill="#83ddd1">ShaderMaterial</text><text x="1072" y="425" class="mono small muted">local to this instance</text>
  <path d="M1058 480H1336" stroke="#293b58"/>
  <text x="1060" y="513" class="ui small" fill="#e5b26b">SURFACE OVERRIDE</text>
  <rect x="1058" y="530" width="278" height="58" rx="8" fill="#17263c"/><text x="1072" y="555" class="ui small muted">Surface 0</text><text x="1072" y="577" class="mono small" fill="#f0b67d">uses local material</text>
  <rect x="1058" y="631" width="278" height="90" rx="9" fill="#203844"/><text x="1072" y="658" class="ui small" fill="#83d9cb">EDITOR PREVIEW PATH</text><text x="1072" y="684" class="ui small muted">HairMaterialProfilePreview</text><text x="1072" y="704" class="ui small muted">refreshes when fields change</text>
  <text x="1060" y="773" class="ui small muted">No profile slot appears here:</text><text x="1060" y="795" class="ui small muted">the script composes the material first.</text>
</svg>
