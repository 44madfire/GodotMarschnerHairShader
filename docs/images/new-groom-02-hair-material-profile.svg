<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">HairMaterialProfile Inspector illustration</title>
  <desc id="desc">An honest editor-style illustration of the HairMaterialProfile Inspector with the quality_tier dropdown set to Fast Marschner and the visible Fast Marschner controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.5" stop-color="#15152b"/>
      <stop offset="1" stop-color="#171126"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4b1d2e"/>
      <stop offset=".45" stop-color="#bd6049"/>
      <stop offset=".72" stop-color="#f0bb68"/>
      <stop offset="1" stop-color="#8450c1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <style>
      .ui { font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #dce7f7; }
      .mono { font-family: 'IBM Plex Mono', 'SFMono-Regular', monospace; fill: #bdcbe2; }
      .muted { fill: #7789a7; }
      .small { font-size: 14px; letter-spacing: .02em; }
      .label { font-size: 16px; font-weight: 600; }
      .value { font-size: 15px; }
      .title { font-size: 23px; font-weight: 600; letter-spacing: -.02em; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="1010" cy="200" r="240" fill="#e26c6d" opacity=".12" filter="url(#glow)"/>
  <circle cx="310" cy="730" r="250" fill="#6b55da" opacity=".12" filter="url(#glow)"/>
  <rect x="24" y="22" width="1352" height="856" rx="18" fill="#0c1423" stroke="#31415d" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="24" y="22" width="1352" height="58" rx="18" fill="#111d31"/>
  <path d="M24 62H1376" stroke="#2a3a56"/>
  <circle cx="52" cy="51" r="7" fill="#ef6b76"/><circle cx="76" cy="51" r="7" fill="#e7ad59"/><circle cx="100" cy="51" r="7" fill="#58c7a4"/>
  <g class="ui">
    <text x="132" y="57" class="title">Godot</text>
    <text x="211" y="56" class="small muted">hair_material_profile_demo.tres</text>
    <text x="1140" y="56" class="small" fill="#d99b5e">EDITOR-STYLE ILLUSTRATION</text>
  </g>
  <text x="1140" y="73" class="ui small muted">not a literal screenshot</text>

  <rect x="42" y="98" width="258" height="756" rx="12" fill="#101a2b" stroke="#293b58"/>
  <text x="64" y="130" class="ui small muted">FILE SYSTEM</text>
  <path d="M62 151H280" stroke="#293b58"/>
