    <text x="64" y="184">res://</text><text x="79" y="217">▾ assets</text><text x="94" y="250">▾ hair</text><text x="109" y="283">▾ materials</text>
    <text x="126" y="317">HairGroomData.gd</text><text x="126" y="347">HairMaterialProfile.gd</text>
    <text x="79" y="395">▾ demos</text><text x="94" y="428">▾ resources</text>
